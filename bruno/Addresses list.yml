info:
  name: Addresses list
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/me/addresses"
  headers:
    - name: x-demo-user
      value: "{{demoUser}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
