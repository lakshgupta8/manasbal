info:
  name: Cart add item
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/cart/items"
  headers:
    - name: x-demo-user
      value: "{{demoUser}}"
  body:
    type: json
    data: |-
      {
        "variantId": "{{variantId}}",
        "quantity": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
