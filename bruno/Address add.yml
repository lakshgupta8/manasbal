info:
  name: Address add
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/me/addresses"
  body:
    type: json
    data: |-
      {
        "name": "Test Buyer",
        "line1": "12 Sample Lane",
        "city": "Sampleton",
        "state": "Example State",
        "pincode": "190006",
        "isDefault": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Address edit and Address delete change the address this request made.
        bru.setVar("addressId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isString
    - expression: res.body.pincode
      operator: eq
      value: '"190006"'
    - expression: res.body.isDefault
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
