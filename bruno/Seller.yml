info:
  name: Seller
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/sellers/{{sellerSlug}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.slug
      operator: eq
      value: "{{sellerSlug}}"
    - expression: res.body.userId
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
