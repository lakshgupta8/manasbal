info:
  name: Sessions
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/me/sessions"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // End session ends another sign-in of this account, if there is one.
        const other = (res.body ?? []).find((session) => !session.current);
        bru.setVar("otherSessionId", other?.id ?? "");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body[0].current
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
