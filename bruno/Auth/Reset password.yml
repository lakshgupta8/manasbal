info:
  name: Reset password
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "password": "made-up-new-password-456"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Reads the link from the newest reset mail to the account, in Mailpit. The API sends it
        // just after answering Forgot password, so this waits up to 3 seconds for it. With
        // MAIL_MODE=off (or no mailpitUrl, as on prod) no mail exists and this request is skipped.
        const axios = require("axios");
        const mailpit = bru.getEnvVar("mailpitUrl");
        const email = bru.getVar("signInEmail");
        let token;
        for (let attempt = 0; mailpit && email && !token && attempt < 15; attempt++) {
          const search = await axios.get(`${mailpit}/api/v1/search`, {
            params: { query: `to:"${email}" subject:"Reset your Manasbal password"`, limit: 1 },
          });
          const id = search.data.messages?.[0]?.ID;
          if (id) {
            const message = await axios.get(`${mailpit}/api/v1/message/${id}`);
            token = /token=([\w-]+)/.exec(message.data.Text)?.[1];
          } else {
            await new Promise((resolve) => setTimeout(resolve, 200));
          }
        }
        if (token) bru.setVar("resetToken", token);
        else bru.runner.skipRequest();
    - type: after-response
      code: |-
        // Sign in with new password runs only after a reset.
        if (res.status === 204) bru.setVar("passwordReset", "yes");
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
