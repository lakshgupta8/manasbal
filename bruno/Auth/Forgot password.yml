info:
  name: Forgot password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{signInEmail}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
