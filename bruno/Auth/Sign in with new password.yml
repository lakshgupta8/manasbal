info:
  name: Sign in with new password
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "{{signInEmail}}",
        "password": "made-up-new-password-456"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Skipped when Reset password was skipped (mail off).
        if (bru.getVar("passwordReset") !== "yes") bru.runner.skipRequest();
    - type: after-response
      code: |-
        // The reset ended every session; the requests after this folder use the new token.
        bru.setVar("accessToken", res.body.accessToken);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.accessToken
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
