info:
  name: Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.email
      operator: eq
      value: "{{signInEmail}}"
    - expression: res.body.role
      operator: eq
      value: buyer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
