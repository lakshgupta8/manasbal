info:
  name: Two-step disable
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/auth/2fa/disable"
  body:
    type: json
    data: |-
      {
        "code": "{{recoveryCode}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
