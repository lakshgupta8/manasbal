info:
  name: Address delete
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/me/addresses/{{addressId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
