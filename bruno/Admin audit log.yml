info:
  name: Admin audit log
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/admin/audit-log?limit=5"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Needs an admin's access token; see bruno/README.md. Skipped until one is set.
        if (!bru.getEnvVar("adminAccessToken")) bru.runner.skipRequest();
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
    - expression: res.body.items[0].action
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
