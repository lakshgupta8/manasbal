info:
  name: Admin audit log
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/admin/audit-log?limit=5"
  headers:
    - name: x-demo-user
      value: "{{adminUser}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray
    - expression: res.body.items[0].action
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
