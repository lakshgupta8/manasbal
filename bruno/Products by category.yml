info:
  name: Products by category
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/products?category=t-shirts&limit=2"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.items
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
