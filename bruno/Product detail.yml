info:
  name: Product detail
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/products/{{productSlug}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.slug
      operator: eq
      value: '"{{productSlug}}"'
    - expression: res.body.seller.storeName
      operator: isString
    - expression: res.body.category.name
      operator: isString
    - expression: res.body.variants
      operator: isArray
    - expression: res.body.variants[0].available
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
