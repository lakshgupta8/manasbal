# Netlify (Free: 300 credits a month, 15 per production deploy).
# Deploy previews build only for PRs into main (the Deploy Previews setting in the Netlify
# dashboard) and only when a change can affect the console (ignore-build.sh). Production deploys
# come only from the release workflow (Netlify CLI), never from a push to main.

[build]
  base = "apps/console"
  command = "cd ../.. && pnpm turbo run build --filter=@manasbal/console"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.22.1"

[context.production]
  # "exit 0" tells Netlify to skip this build.
  ignore = "exit 0"

[context.deploy-preview]
  ignore = "bash ignore-build.sh"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
