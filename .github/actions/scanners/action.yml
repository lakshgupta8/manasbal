name: Security scanners
description: gitleaks and Trivy as pinned, checksum-verified binaries on the PATH.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        TRIVY_VERSION: 0.75.0
        TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/scanners"
        mkdir -p "$dir" && cd "$dir"
        fetch() {
          curl -fsSL --retry 3 -o "$1" "$2"
          echo "$3  $1" | sha256sum --check --strict -
          tar -xzf "$1"
        }
        fetch gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
        fetch trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "$TRIVY_SHA256"
        echo "$dir" >> "$GITHUB_PATH"
