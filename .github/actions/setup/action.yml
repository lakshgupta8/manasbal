name: Setup
description: pnpm (version from package.json), Node (from .nvmrc) and dependencies.

inputs:
  install:
    description: Install dependencies after setting up the toolchain.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Only cache the pnpm store when we install; otherwise there is nothing to save
        # and the post-job cache step fails.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
