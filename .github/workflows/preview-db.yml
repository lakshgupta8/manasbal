name: Preview database

# One Neon branch per pull request into main (the weekly dev -> main PR, ADR 0009), deleted when
# the PR closes. Switched on by setting the repository variable NEON_PROJECT_ID and the secret
# NEON_API_KEY.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-db-${{ github.event.number }}

jobs:
  create:
    if: github.event.action != 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expire in 14 days even if the PR is never closed
        id: expiry
        run: echo "at=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          database: manasbal
          # The project's owner role; the action otherwise assumes neondb_owner.
          role: manasbal_owner
          # Legal guardrail: previews get the schema only, never a copy of the demo
          # database (it may hold real visitors' sign-ups). Seed data arrives in Phase 4.
          branch_type: schema-only
          expires_at: ${{ steps.expiry.outputs.at }}

  delete:
    if: github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.number }}
