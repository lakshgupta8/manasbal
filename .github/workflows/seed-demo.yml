name: Reset demo data

# Wipes the live demo database every night and seeds the demo profile again, so visitors' rows
# last at most a day, and the demo logins (one per role) come back with their public password. The reset refuses unless SEED_ALLOW_RESET=true and the database has a
# _demo_marker row (see packages/seed/README.md for the one-time setup).
#
# Scheduled runs use this file from the default branch (dev) but check out main, the released
# code, and migrate only up to the prod ref, so the live database never gets a schema no
# released API uses. A manual run can pick another branch, for example dev before the first
# release that contains the seed.

on:
  schedule:
    # 21:00 UTC = 02:30 IST, when the demo is quietest.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to seed from (the released code is main)
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: seed-demo
  cancel-in-progress: false

jobs:
  reset:
    name: Reset and re-seed the demo database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: ./.github/actions/setup

      # The seed imports slugify and the demo emails from @manasbal/types, which runs from its
      # build (dist/). seed:reset builds it too; this step makes the order explicit and fails
      # here, before the database is touched, if the build breaks.
      - name: Build @manasbal/types
        run: pnpm --filter @manasbal/types build

      # DATABASE_URL is Neon's direct (unpooled) string: TRUNCATE and migrations must not go
      # through the pooler, as in deploy.yml.
      - name: Reset to the demo profile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_ALLOW_RESET: "true"
          SEED_MIGRATE_TO: prod
        run: pnpm seed:reset --profile demo

      - name: Smoke check (the live API lists at least one product; free instances cold-start slowly)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for _ in $(seq 1 30); do
            count=$(curl -fsS --max-time 10 "$API_URL/products?limit=1" | jq '.items | length' || true)
            if [ "${count:-0}" -ge 1 ]; then echo "The API lists products again"; exit 0; fi
            sleep 10
          done
          echo "::error::$API_URL/products listed no products after the reset"; exit 1

      # The demo customer's password is public (packages/seed/src/demo-logins.ts and the README;
      # the emails are in packages/types/src/demo-logins.ts),
      # so the check can sign in with it. Only the access token is secret: it is masked before
      # anything could print it. The right password never trips the 5-try lockout, and sign-in
      # needs no Origin header (only refresh and sign-out do).
      - name: Smoke check (the demo customer can sign in and GET /me answers role customer)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          logins=packages/seed/src/demo-logins.ts
          # A released main from before the demo logins has no such file and no such account.
          if [ ! -f "$logins" ]; then echo "::notice::No demo logins in this code yet; skipped"; exit 0; fi
          emails=packages/types/src/demo-logins.ts
          # A released main from before the emails moved to @manasbal/types keeps them beside the password.
          if [ ! -f "$emails" ]; then emails=$logins; fi
          read -r email password < <(node --input-type=module -e "
            import { DEMO_EMAILS } from './$emails';
            import { DEMO_PASSWORD } from './$logins';
            console.log(DEMO_EMAILS.customer, DEMO_PASSWORD);")
          body=$(jq -n --arg email "$email" --arg password "$password" '{email: $email, password: $password}')
          token=$(curl -fsS --max-time 30 -X POST "$API_URL/auth/sign-in" \
            -H "content-type: application/json" -d "$body" | jq -r '.accessToken // empty' || true)
          if [ -z "$token" ]; then echo "::error::$email could not sign in to $API_URL"; exit 1; fi
          echo "::add-mask::$token"
          role=$(curl -fsS --max-time 30 "$API_URL/me" -H "authorization: Bearer $token" | jq -r '.role' || true)
          if [ "$role" != "customer" ]; then echo "::error::GET /me as $email answered role '$role'"; exit 1; fi
          echo "$email signed in and GET /me answered role customer"
