# SonarQube Cloud (CI-based analysis; turn off "Automatic Analysis" in the project settings).
sonar.organization=lakshgupta8
sonar.projectKey=lakshgupta8_manasbal
sonar.projectName=Manasbal

sonar.sources=apps,packages,scripts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/storybook-static/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
# Stories and Storybook config are documentation, not code that needs unit coverage.
sonar.coverage.exclusions=**/*.stories.tsx,**/.storybook/**

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,packages/ui/coverage/lcov.info
