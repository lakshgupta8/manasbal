packages:
  - "apps/*"
  - "packages/*"

# typescript-eslint and the Nest CLI don't support TypeScript 7 yet (checked Oct 2026).
overrides:
  typescript: ~6.0.3
  # CVE-2023-54404 (denial of service on unbounded arrays) is fixed in 4.6.6. eslint-plugin-react-hooks
  # still locked an older copy.
  "zod@<4.6.6": ^4.6.6
  # GHSA-333x-w4r6-6crp (scheme injection) is fixed in 3.1.9 and 4.2.3. Fastify 5.12.8 still locks
  # older copies through ajv and fast-json-stringify.
  "fast-uri@>=3.0.0 <3.1.9": ~3.1.9
  "fast-uri@>=4.0.0 <4.2.3": ~4.2.3
  # GHSA-389g-gv7q-r4x8 (header validation bypass) is fixed in 5.12.6. @nestjs/platform-fastify 12.1
  # pins 5.12.5 exactly, and its copy is the one that serves requests; 12.5.1 pins 5.12.8.
  "@nestjs/platform-fastify>fastify": 5.12.8

# @nestjs/platform-fastify imports rxjs without declaring it, so it only resolved through
# pnpm's hidden hoisting. Declaring the peer makes the link explicit and stable.
packageExtensions:
  "@nestjs/platform-fastify":
    peerDependencies:
      rxjs: ^7.1.0

# pnpm 12 refuses to install while a dependency's build script is neither allowed nor denied.
# pnpm 10 skipped all of them and everything worked: the native ones ship prebuilt binaries, and
# @scarf/scarf only sends install analytics.
allowBuilds:
  # next-intl's message extractor brings these two; both ship prebuilt binaries.
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  workerd: false

# Refuse to install on a Node older than package.json's engines (24.22.3, the latest 24 LTS
# patch release).
engineStrict: true
